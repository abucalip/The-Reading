[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-reading"
version = "0.1.0"
description = "Personalized daily EPUB newspaper generator for Moon+ Reader Pro via Google Drive"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "ebooklib>=0.18",
    "feedparser>=6.0.11",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.1",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "trafilatura>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-httpx>=0.32.0",
]

[project.scripts]
the-reading = "the_reading.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/the_reading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
